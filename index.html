<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Organiseur personnel : calendrier, tâches, jour, habitudes et listes.">
  <link rel="manifest" href="./manifest.webmanifest" vite-ignore>
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <title>Mon petit organiseur</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: "New York", Charter, Georgia, serif;
      --ink: #302923;
      --muted: #6e6055;
      --paper: #fffcf6;
      --linen: #f6eee2;
      --line: #e8dccb;
      --copper: #965036;
      --sage-dark: #30493d;
      --accent: var(--theme-accent, #476c59);
      --tint: var(--theme-tint, #e5eee6);
      --highlight: var(--theme-highlight, #b5d0bd);
      --radius: 22px;
      --gutter: clamp(17px, 5.15vw, 36px);
      --shadow: 0 5px 18px #5232160b;
      background: #eee4d6;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100svh;
      background:
        var(--personal-background, none) center top / cover fixed,
        radial-gradient(ellipse at 50% 0%, #fff6e6 0%, transparent 58%),
        #eadccc;
      background-color: color-mix(in srgb, var(--theme-backdrop, #f7f5f0) 35%, #eadccc);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    :focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    .app-shell {
      max-width: 770px;
      min-height: 100svh;
      margin-inline: auto;
      padding-bottom: calc(108px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      background: rgb(251 246 237 / .84);
      box-shadow: 0 12px 80px #4e312221;
    }
    .app-top {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(11px + env(safe-area-inset-top)) var(--gutter) 10px;
      background: rgb(251 246 237 / .95);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #ebdfd0;
    }
    .identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .app-mark {
      width: 39px;
      height: 39px;
      flex: none;
      border-radius: 13px;
      box-shadow: 0 2px 6px #294c3620;
    }
    .app-title {
      margin: 0;
      font: 400 clamp(21px, 5.6vw, 28px)/1.08 var(--serif);
      letter-spacing: -.045em;
    }
    .header-tools { display: flex; gap: 5px; }
    .icon-button {
      flex: none;
      display: inline-grid;
      place-items: center;
      width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--paper);
      color: var(--sage-dark);
      font-size: 20px;
      line-height: 1;
    }
    .icon-button[aria-current="page"] {
      color: var(--accent);
      background: var(--tint);
      border-color: var(--highlight);
    }
    .sync-state {
      align-self: flex-start;
      display: flex;
      align-items: baseline;
      gap: 8px;
      max-width: calc(100% - 2 * var(--gutter));
      margin: 13px var(--gutter) 0;
      padding: 6px 11px;
      border-radius: 10px;
      color: #67594d;
      background: #efe7da;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .sync-state::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex: none;
      transform: translateY(-1px);
    }
    .sync-synced { color: #365144; background: #e8eee4; }
    .sync-pending { color: #74511e; background: #f8eacb; }
    .sync-error { color: #883d32; background: #f6e1d7; }
    .content-area { width: 100%; flex: 1; padding: 16px var(--gutter) 28px; }
    .content-area:focus { outline: none; }
    .page-intro {
      padding: clamp(22px, 5vw, 36px);
      border: 1px solid var(--line);
      border-radius: 25px;
      background: radial-gradient(ellipse at 100% -30%, var(--tint), transparent 65%), var(--paper);
      box-shadow: var(--shadow);
    }
    .page-intro h2, .sheet-header h2 {
      margin: 0;
      color: var(--ink);
      font: 400 clamp(32px, 8vw, 49px)/1.05 var(--serif);
      letter-spacing: -.055em;
      overflow-wrap: anywhere;
    }
    .page-intro .muted { max-width: 48ch; }
    .day-intro {
      position: relative;
      isolation: isolate;
      display: flex;
      min-height: clamp(230px, 49vw, 315px);
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      border-color: #5a4032;
      background: #4c362a;
      box-shadow: 0 12px 28px #52321626;
    }
    .day-intro::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, #2d2018f4 0%, #35261dd9 34%, #36261bb0 52%, #36261b18 88%),
        var(--day-art, radial-gradient(ellipse at 83% 25%, #daa574 0%, #947253 30%, #654c39 62%));
      background-position: center, center;
      background-size: cover;
    }
    .day-intro h2 { color: #fff9eb; font-size: clamp(37px, 10.6vw, 69px); }
    .day-weekday {
      display: block;
      margin-bottom: 6px;
      color: #f1d9bd;
      font: 650 clamp(13px, 3.6vw, 17px)/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .045em;
      text-transform: capitalize;
    }
    .day-date { display: block; }
    .muted { margin: 8px 0; color: var(--muted); font-size: .875rem; line-height: 1.55; }
    .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 15px; }
    .day-intro .header-actions { margin-top: 19px; }
    .primary-button, .soft-button, .text-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-inline-size: 44px;
      min-height: 44px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 13px;
      text-align: center;
      font-size: .875rem;
      line-height: 1.25;
      font-weight: 650;
    }
    .primary-button { background: var(--accent); color: white; box-shadow: 0 3px 9px #3929191e; }
    .primary-button.compact, .soft-button.compact { padding-inline: 12px; }
    .soft-button { background: var(--paper); color: var(--sage-dark); border-color: var(--line); }
    .text-button {
      background: transparent;
      color: var(--sage-dark);
      text-decoration: underline;
      text-underline-offset: 4px;
      padding-inline: 8px;
    }
    .day-intro .primary-button { background: #fff6e3; color: #4d3224; }
    .day-intro .soft-button { background: #35271fb8; color: #fff8e8; border-color: #dbc2a986; }
    .day-intro button:focus-visible { outline-color: #ffdfa9; }
    .destructive { color: #914a3d; }
    @media (hover: hover) {
      .primary-button:hover { filter: brightness(.92); }
      .soft-button:hover, .icon-button:hover { border-color: var(--highlight); background: var(--tint); }
      .day-intro .soft-button:hover { background: #35271f; border-color: #f1d9bd; }
    }
    .day-section { margin-top: 27px; }
    .section-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .section-heading::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .section-heading h3, .day-section h3 {
      margin: 0 0 10px;
      color: var(--ink);
      font: 400 25px/1.15 var(--serif);
      letter-spacing: -.035em;
    }
    .section-heading h3 { margin: 0; }
    .entry-list { display: flex; flex-direction: column; gap: 9px; }
    .empty-copy {
      margin: 0;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgb(255 252 246 / .78);
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.48;
    }
    .content-area > .soft-button { margin-top: 14px; }
    .day-intro + .empty-copy { margin-top: 14px; }
    .activity-row, .habit-card, .checklist-card, .auth-panel, .settings-group {
      margin: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .activity-row, .habit-card { display: flex; align-items: center; gap: 11px; min-height: 70px; }
    .activity-icon, .habit-picto {
      flex: none;
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      border: 1px solid #e7d9c8;
      border-radius: 13px;
      background: #f4e8d9;
      color: #80553d;
      font-size: 21px;
    }
    .activity-details, .habit-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .activity-details strong, .habit-text strong { overflow-wrap: anywhere; color: var(--ink); font-size: .96rem; }
    .activity-meta, .habit-text small, .subtle-tag { color: var(--muted); font-size: .8125rem; line-height: 1.35; }
    .check-control {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1.5px solid #a69b89;
      border-radius: 50%;
      background: var(--paper);
      color: #66594d;
      font-size: 22px;
      line-height: 1;
    }
    .check-control.is-checked { background: var(--tint); border-color: var(--accent); color: var(--accent); font-size: 18px; }
    .habit-card { width: 100%; text-align: left; }
    .bottom-tabs {
      position: fixed;
      z-index: 20;
      bottom: calc(9px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      width: min(560px, calc(100% - 22px));
      padding: 5px;
      border: 1px solid #e1d3c2;
      border-radius: 22px;
      background: rgb(255 252 246 / .97);
      box-shadow: 0 5px 22px #442e2524;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .tab-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      min-height: 56px;
      padding: 5px 0;
      border: 0;
      border-radius: 16px;
      background: none;
      color: #655a50;
    }
    .tab-item.active { background: var(--tint); color: var(--accent); font-weight: 750; }
    .tab-center.active { background: var(--accent); color: white; }
    .tab-symbol { position: relative; display: grid; place-items: center; width: 23px; height: 23px; font-size: 0; }
    .tab-symbol::before, .tab-symbol::after { position: absolute; content: ""; pointer-events: none; }
    [data-tab="calendar"] .tab-symbol::before { inset: 4px 2px 2px; border: 1.6px solid; border-radius: 4px; }
    [data-tab="calendar"] .tab-symbol::after { top: 8px; left: 3px; right: 3px; height: 2px; background: currentColor; }
    [data-tab="tasks"] .tab-symbol::before { inset: 2px 3px; border: 1.6px solid; border-radius: 5px; }
    [data-tab="tasks"] .tab-symbol::after { width: 8px; height: 5px; border: solid; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
    [data-tab="day"] .tab-symbol { font-size: 23px; line-height: 1; }
    [data-tab="habits"] .tab-symbol::before { inset: 2px; border: 1.6px solid; border-inline-end-color: transparent; border-radius: 50%; }
    [data-tab="habits"] .tab-symbol::after { top: 3px; right: 3px; width: 5px; height: 5px; border: solid; border-width: 0 1.6px 1.6px 0; transform: rotate(-18deg); }
    [data-tab="lists"] .tab-symbol::before { left: 7px; width: 13px; height: 2px; background: currentColor; box-shadow: 0 -6px currentColor, 0 6px currentColor; }
    [data-tab="lists"] .tab-symbol::after { left: 2px; width: 2px; height: 2px; background: currentColor; border-radius: 50%; box-shadow: 0 -6px currentColor, 0 6px currentColor; }
    .tab-label { font-size: .69rem; line-height: 1.15; }
    .week-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 20px; }
    .calendar-day {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 119px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
      text-align: left;
    }
    .calendar-day strong { margin: 5px 0 7px; font: 400 34px/1 var(--serif); }
    .calendar-day.selected { background: var(--tint); border-color: var(--accent); }
    .calendar-day.is-today strong { color: var(--accent); }
    .calendar-weekday { font-size: .72rem; color: var(--muted); font-weight: 700; }
    .calendar-counter { color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
    .sunday-toggle { margin: 13px 0 8px; width: 100%; }
    .sunday-panel .calendar-day { width: 100%; min-height: 92px; }
    .sunday-panel.is-collapsed { display: none; }
    .calendar-footnote { margin: 12px 0 0; text-align: center; }
    .inline-form { display: flex; align-items: center; gap: 8px; margin-top: 13px; }
    .inline-form input { min-width: 0; flex: 1; }
    .inline-form button { flex: none; }
    input, select, textarea {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #d9cebf;
      border-radius: 12px;
      background: #fffdf9;
      color: var(--ink);
      font-size: max(16px, 1rem);
    }
    input[type="checkbox"] { width: 19px; height: 19px; min-height: 0; accent-color: var(--accent); }
    input[type="file"] { max-width: 100%; padding: 7px; overflow: hidden; }
    input::file-selector-button {
      margin-right: 8px;
      border: 0;
      border-radius: 8px;
      padding: 7px 9px;
      background: var(--tint);
      color: var(--ink);
    }
    .checklist-card { padding-block: 0; }
    .checklist-open { min-height: 56px; width: 100%; padding: 12px 3px; border: 0; background: none; color: var(--ink); text-align: left; font-weight: 650; }
    .checklist-open[aria-expanded="true"] { border-bottom: 1px solid var(--line); }
    .checklist-detail:not(:empty) { padding-block: 10px; }
    .checklist-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 3px; }
    .checklist-item span { flex: 1; font-size: .94rem; }
    .settings-list { display: flex; flex-direction: column; gap: 8px; }
    .settings-group { margin-top: 15px; padding: 17px; }
    .settings-group h3 { margin-bottom: 2px; font-size: 23px; }
    .settings-group > button { justify-content: flex-start; text-align: left; }
    .settings-group .header-actions { margin-top: 0; }
    .settings-group p:empty, .settings-group .entry-list:empty, .calendar-footnote:empty, #task-status:empty { display: none; }
    .auth-panel { margin-top: 16px; padding: 20px; }
    .auth-panel form, .editor-sheet form { display: flex; flex-direction: column; gap: 13px; }
    .auth-panel label, .editor-sheet label, .media-import label {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 6px;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 650;
    }
    .auth-actions { display: flex; justify-content: space-between; flex-wrap: wrap; }
    .form-error { color: #914a3d; font-size: .875rem; line-height: 1.48; }
    .form-error:empty { display: none; }
    .editor-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: #2b211a83;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    .editor-sheet {
      width: min(610px, 100%);
      max-height: 92svh;
      overflow: auto;
      padding: 12px var(--gutter) calc(22px + env(safe-area-inset-bottom));
      border: 1px solid var(--line);
      border-radius: 25px 25px 0 0;
      background: var(--paper);
      box-shadow: 0 -12px 44px #2b211a36;
    }
    .sheet-handle { width: 35px; height: 4px; border-radius: 99px; background: #d5c7b6; margin: 0 auto 13px; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .sheet-header h2 { font-size: 31px; }
    .editor-sheet .form-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .editor-sheet .inline-choice { min-height: 44px; flex-direction: row; align-items: center; font-weight: 500; }
    .weekday-field {display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
    .weekday-field legend { color: var(--muted); font-size: .82rem; }
    .weekday-field label { min-height: 44px; align-items: center; justify-content: center; gap: 1px; padding: 2px 5px; }
    .media-import, .player-controls, .carry-notice, .carry-choice {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .media-import { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 10px; }
    .player-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .player-controls > button { min-width: 44px; }
    .player-controls label { display: grid; flex: 1; min-width: 120px; gap: 4px; color: var(--muted); font-size: .875rem; }
    .image-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .image-tile { min-width: 0; margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
    .image-tile img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: var(--linen); }
    .image-tile figcaption { padding: 8px 2px 2px; color: var(--ink); font-size: .875rem; line-height: 1.4; overflow-wrap: anywhere; }
    .image-tile .header-actions { margin-top: 7px; }
    .image-tile .header-actions button { width: 100%; }
    .carry-notice { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 13px 0; }
    .carry-notice p { flex: 1; margin: 0; color: var(--muted); font-size: .875rem; }
    .carry-choice { display: grid; gap: 5px; margin-block: 8px; }
    .carry-choice strong { overflow-wrap: anywhere; }
    .carry-form { max-height: 65svh; overflow: auto; padding-bottom: 12px; }
    .review-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .review-filters input, .review-filters select { flex: 1; min-width: 110px; }
    @media (max-width: 480px) {
      .media-import { grid-template-columns: 1fr; }
      .carry-notice { flex-direction: column; align-items: stretch; }
    }
    @media (min-width: 810px) {
      .app-shell { margin-block: 20px; min-height: calc(100svh - 40px); border-radius: 28px; overflow: clip; }
      .bottom-tabs { bottom: 25px; }
      .editor-backdrop { align-items: center; }
      .editor-sheet { border-radius: 25px; }
    }
    @media (max-width: 350px) {
      .identity { gap: 6px; }
      .app-mark { width: 33px; height: 33px; border-radius: 10px; }
      .app-top, .header-tools { gap: 4px; }
      .calendar-day { padding: 8px; }
      .tab-label { font-size: .63rem; }
    }
  </style>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app">
    <main class="app-shell"><p class="empty-copy">Préparation de l'organiseur…</p></main>
  </div>
</body>
</html>
